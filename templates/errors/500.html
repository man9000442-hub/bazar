<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خطأ في الخادم | 500</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- متغيرات النظام (Ultra-Modern UI) --- */
        :root {
            --bg-main: #F4F5F8;
            --surface: #FFFFFF;
            --text-primary: #0A0A0A;
            --text-secondary: #71717A;
            --accent-dark: #000000;
            --danger: #EF4444;
            --danger-light: #FEE2E2;
            --border-light: rgba(0, 0, 0, 0.04);
        }

        body {
            background-color: var(--bg-main);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* --- الأنيميشن --- */
        @keyframes fadeUpIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseSoft {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.4; }
        }

        .animate-fade-up { animation: fadeUpIn 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards; opacity: 0; }

        /* --- الكارت الرئيسي --- */
        .error-card-neo {
            background: var(--surface);
            border-radius: 40px;
            padding: 60px 32px;
            border: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.03);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        /* --- تصميم الرقم 500 --- */
        .error-number {
            font-size: 110px;
            font-weight: 900;
            color: var(--accent-dark);
            line-height: 1;
            letter-spacing: -5px;
            position: relative;
            display: inline-block;
            margin-bottom: 8px;
        }
        
        /* اللمسة الحمراء التي تنبض خلف الرقم */
        .error-number::after {
            content: '';
            position: absolute;
            bottom: 20px;
            right: -10px;
            width: 35px;
            height: 35px;
            background: var(--danger);
            border-radius: 50%;
            z-index: -1;
            animation: pulseSoft 2s ease-in-out infinite;
        }

        /* --- الأيقونة --- */
        .icon-box-neo {
            width: 60px; height: 60px;
            background: var(--danger-light);
            color: var(--danger);
            border-radius: 20px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 28px;
            margin-bottom: 24px;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.1);
        }

        /* --- الأزرار --- */
        .btn-neo-primary {
            background: var(--accent-dark) !important;
            color: #fff !important;
            border: none;
            font-weight: 800;
            border-radius: 50px;
            padding: 16px;
            font-size: 15px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: flex; justify-content: center; align-items: center; gap: 10px;
            text-decoration: none;
            width: 100%;
        }
        .btn-neo-primary:active { transform: scale(0.96); box-shadow: 0 5px 10px rgba(0,0,0,0.05); }

        .btn-neo-outline {
            background: transparent;
            color: var(--text-primary) !important;
            border: 2px solid var(--border-light);
            font-weight: 800;
            border-radius: 50px;
            padding: 16px;
            font-size: 15px;
            transition: all 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            text-decoration: none;
            width: 100%;
        }
        .btn-neo-outline:hover { background: #F4F4F5; border-color: transparent; }
        .btn-neo-outline:active { transform: scale(0.96); }

    </style>
</head>
<body>

    <div class="error-card-neo animate-fade-up">
        
        <div class="icon-box-neo">
            <i class="fas fa-server"></i>
        </div>

        <div class="error-number">500</div>
        
        <h3 class="fw-bold mb-3" style="color: var(--text-primary); letter-spacing: -0.5px;">
            عذراً، حدث خطأ تقني!
        </h3>
        
        <p class="mb-5" style="color: var(--text-secondary); font-weight: 500; font-size: 15px; line-height: 1.8;">
            يبدو أن هناك مشكلة داخلية في الخادم تعيق طلبك. فريقنا التقني تم إشعاره بالمشكلة وجاري العمل على حلها في أسرع وقت ممكن.
        </p>
        
        <div class="d-grid gap-3">
            <button onclick="window.location.reload();" class="btn-neo-primary">
                <i class="fas fa-sync-alt"></i> تحديث الصفحة
            </button>
            <a href="/" class="btn-neo-outline">
                <i class="fas fa-home"></i> العودة للرئيسية
            </a>
        </div>
        
    </div>

</body>
</html>
