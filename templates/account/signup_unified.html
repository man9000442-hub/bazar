{% extends 'base.html' %}
{% block content %}
<div class="container text-center py-5" style="min-height: 80vh;">
    <h3 class="fw-bold mb-5">كيف تريد التسجيل؟ 🤔</h3>
    <div class="row g-4 justify-content-center">
        <div class="col-md-5">
            <a href="{% url 'customer_signup' %}" class="card p-5 text-decoration-none border-0 shadow-sm h-100 hover-up">
                <i class="fas fa-shopping-bag fa-4x text-primary mb-3"></i>
                <h4 class="text-dark">أنا عميل</h4>
                <p class="text-muted small">أريد تصفح وشراء المنتجات</p>
            </a>
        </div>
        <div class="col-md-5">
            <a href="{% url 'merchant_signup' %}" class="card p-5 text-decoration-none border-0 shadow-sm h-100 hover-up">
                <i class="fas fa-store fa-4x text-warning mb-3"></i>
                <h4 class="text-dark">أنا تاجر</h4>
                <p class="text-muted small">أريد بيع منتجاتي على المنصة</p>
            </a>
        </div>
    </div>
</div>
{% endblock %}
