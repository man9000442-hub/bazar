{% extends 'base.html' %}
{% load i18n %}
{% load account socialaccount %}

{% block content %}
<div class="container d-flex flex-column justify-content-center" style="min-height: 80vh;">
    
    <div class="text-center mb-5">
        <h2 class="fw-bold text-primary mb-1">مرحباً بعودتك! 👋</h2>
        <p class="text-muted">سجل الدخول للمتابعة</p>
    </div>

    <form class="login" method="POST" action="{% url 'account_login' %}">
        {% csrf_token %}
        
        <!-- في حقل الـ login -->
        <div class="mb-3">
            <!-- تغيير النص التوضيحي -->
            <input type="text" name="login" class="form-control form-control-lg bg-light border-0" 
                placeholder="رقم الهاتف / الإيميل / اسم المستخدم" required>
        </div>
        
        <div class="mb-4">
            <input type="password" name="password" class="form-control form-control-lg bg-light border-0" placeholder="كلمة المرور" required>
        </div>

        <button type="submit" class="btn btn-primary-app w-100 py-3 fw-bold shadow-sm mb-3">دخول</button>
        
        <!-- زر جوجل -->
        <a href="{% provider_login_url 'google' %}" class="btn btn-light w-100 py-3 fw-bold border d-flex align-items-center justify-content-center gap-2">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20">
            الدخول باستخدام Google
        </a>
    </form>
    
    <div class="text-center mt-4">
        <span class="text-muted">ليس لديك حساب؟</span>
        <a href="{% url 'account_signup' %}" class="fw-bold text-primary text-decoration-none">سجل الآن</a>
    </div>
</div>
{% endblock %}
