{% extends 'base.html' %}
{% load i18n %} 

{% block content %}

<style>
  /* --- متغيرات النظام (Ultra-Modern UI) --- */
  :root {
    --bg-main: #F4F5F8;
    --surface: #FFFFFF;
    --text-primary: #0A0A0A;
    --text-secondary: #71717A;
    --accent-dark: #000000;
    --danger: #EF4444;
    --danger-light: #FEE2E2;
    --success: #10B981;
    --border-light: rgba(0, 0, 0, 0.04);
  }

  /* --- تهيئة الصفحة لتكون شاشة كاملة (Full Screen App-like) --- */
  html, body {
    height: 100%;
    overflow: hidden; /* لمنع التمرير المزدوج المزعج */
    background-color: var(--bg-main) !important;
    color: var(--text-primary);
    font-family: 'Tajawal', sans-serif;
    padding-bottom: 0 !important; 
  }
  
  /* إخفاء القائمة السفلية لتوفير المساحة والتركيز على الدفع */
  .bottom-nav { display: none !important; }

  /* --- الهيدر الخاص بالدفع --- */
  .checkout-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 8px;
  }

  .secure-title {
    font-weight: 800;
    font-size: 18px;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
  }

  /* --- زر الإلغاء الناعم --- */
  .btn-neo-danger-outline {
    background: transparent !important;
    color: var(--danger) !important;
    border: 2px solid rgba(239, 68, 68, 0.2) !important;
    font-weight: 800;
    border-radius: 50px;
    padding: 8px 20px;
    font-size: 13px;
    transition: all 0.3s;
  }
  .btn-neo-danger-outline:active { 
    transform: scale(0.95); 
    background: var(--danger-light) !important; 
  }

  /* --- إطار بوابة الدفع (Iframe Container) --- */
  .neo-iframe-card {
    background: var(--surface);
    border-radius: 32px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.06);
    border: 1px solid var(--border-light);
    flex-grow: 1;
    overflow: hidden;
    position: relative;
    margin-bottom: 20px;
    animation: fadeUpIn 0.5s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
  }

  @keyframes fadeUpIn {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* --- شاشة التحميل (Loader) --- */
  .secure-loader-wrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 0;
    width: 80%;
  }

  /* تأثير دائرة التحميل السوداء الفخمة */
  .neo-spinner {
    width: 3rem;
    height: 3rem;
    border: 4px solid #E4E4E7;
    border-top-color: var(--accent-dark);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px auto;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* إطار الـ Iframe نفسه */
  .payment-iframe {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: none;
    background-color: transparent;
  }
</style>

<div class="container d-flex flex-column px-3" style="height: 100vh;"> 
    
    <div class="checkout-header">
        <h5 class="secure-title m-0">
            <i class="fas fa-shield-check me-2" style="color: var(--success); font-size: 20px;"></i>
            {% trans "الدفع الآمن" %}
        </h5>
        <a href="{% url 'my_orders' %}" class="btn btn-neo-danger-outline">
            {% trans "إلغاء والعودة" %}
        </a>
    </div>

    <div class="neo-iframe-card">
        
        <div class="secure-loader-wrapper">
            <div class="neo-spinner"></div>
            <h6 class="fw-bold mb-1" style="color: var(--text-primary); letter-spacing: -0.5px;">{% trans "جاري تأمين بوابة الدفع..." %}</h6>
            <p class="small m-0" style="color: var(--text-secondary); font-weight: 500;">{% trans "يرجى الانتظار ولا تقم بإغلاق هذه الصفحة." %}</p>
        </div>
        
        <iframe src="{{ iframe_url }}" class="payment-iframe" allowpaymentrequest="true"></iframe>
        
    </div>

</div>

{% endblock %}
