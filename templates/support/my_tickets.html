{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="fw-bold">الدعم الفني 🎧</h5>
        <a href="{% url 'create_ticket' %}" class="btn btn-primary-app btn-sm px-3 rounded-pill">
            <i class="fas fa-plus"></i> تذكرة جديدة
        </a>
    </div>

    {% for ticket in tickets %}
    <a href="{% url 'ticket_detail' ticket.pk %}" class="text-decoration-none text-dark">
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between mb-2">
                    <h6 class="fw-bold mb-0">#{{ ticket.id }} {{ ticket.subject }}</h6>
                    <span class="badge {% if ticket.status == 'OPEN' %}bg-success{% else %}bg-secondary{% endif %}">
                        {{ ticket.get_status_display }}
                    </span>
                </div>
                <p class="text-muted small text-truncate">{{ ticket.message }}</p>
                <small class="text-muted" style="font-size: 10px;">{{ ticket.created_at|timesince }}</small>
            </div>
        </div>
    </a>
    {% empty %}
    <div class="text-center py-5">
        <i class="far fa-smile fa-3x text-muted opacity-50 mb-3"></i>
        <p class="text-muted">ليس لديك تذاكر دعم حالياً.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
