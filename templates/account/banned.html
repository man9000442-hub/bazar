<!doctype html>
{% load i18n %}
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>
      {% trans "حساب محظور" %} | {{ site_settings.site_name|default:"Elbazaar"
      }}
    </title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- متغيرات النظام (Ultra-Modern UI) --- */
      :root {
        --bg-main: #f4f5f8;
        --surface: #ffffff;
        --text-primary: #0a0a0a;
        --text-secondary: #71717a;
        --accent-dark: #000000;
        --danger: #ef4444;
        --danger-light: #fee2e2;
      }

      body {
        background-color: var(--bg-main);
        font-family: "Tajawal", sans-serif;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        -webkit-font-smoothing: antialiased;
      }

      /* --- أنيميشن الدخول --- */
      @keyframes fadeUpIn {
        0% {
          opacity: 0;
          transform: translateY(30px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes scaleUp {
        0% {
          opacity: 0;
          transform: scale(0.8);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .animate-fade-up {
        animation: fadeUpIn 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        opacity: 0;
      }
      .animate-scale-up {
        animation: scaleUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        opacity: 0;
      }

      /* --- كارت الحظر الفاخر --- */
      .neo-banned-card {
        background: var(--surface);
        border-radius: 40px;
        padding: 48px 32px;
        border: none;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.05);
        max-width: 480px;
        width: 100%;
        text-align: center;
      }

      /* --- أيقونة الحظر --- */
      .ban-icon-wrapper {
        width: 100px;
        height: 100px;
        background: var(--danger-light);
        color: var(--danger);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        margin: 0 auto 24px auto;
        box-shadow: 0 10px 25px rgba(239, 68, 68, 0.15);
      }

      /* --- الأزرار العصرية --- */
      .btn-neo-primary {
        background: var(--accent-dark) !important;
        color: #fff !important;
        border: none;
        font-weight: 800;
        border-radius: 50px;
        padding: 16px;
        transition: all 0.3s;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
      .btn-neo-primary:active {
        transform: scale(0.96);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);
      }

      .btn-neo-outline {
        background: transparent;
        color: var(--danger);
        border: 2px solid rgba(239, 68, 68, 0.2);
        font-weight: 800;
        border-radius: 50px;
        padding: 16px;
        transition: all 0.3s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
      .btn-neo-outline:active {
        transform: scale(0.96);
        background: var(--danger-light);
        border-color: transparent;
      }
    </style>
  </head>
  <body>
    <div class="neo-banned-card animate-fade-up">
      <div
        class="ban-icon-wrapper animate-scale-up"
        style="animation-delay: 150ms"
      >
        <i class="fas fa-user-lock"></i>
      </div>

      <h3
        class="fw-bold mb-3 animate-fade-up"
        style="letter-spacing: -0.5px; animation-delay: 250ms"
      >
        {% trans "عفواً، تم إيقاف حسابك" %}
      </h3>

      <p
        class="mb-5 animate-fade-up"
        style="
          color: var(--text-secondary);
          font-size: 15px;
          font-weight: 500;
          line-height: 1.8;
          animation-delay: 350ms;
        "
      >
        {% trans "لقد قمت بمخالفة شروط الاستخدام أو سياسات المنصة، ولذلك تم
        تقييد وصولك مؤقتاً." %}
      </p>

      <div class="d-grid gap-3 animate-fade-up" style="animation-delay: 450ms">
        <a
          href="{% url 'create_ticket' %}"
          class="btn-neo-primary text-decoration-none"
        >
          <i class="fas fa-headset"></i> {% trans "تواصل مع الدعم لفك الحظر" %}
        </a>
        <a
          href="{% url 'account_logout' %}"
          class="btn-neo-outline text-decoration-none"
        >
          <i class="fas fa-sign-out-alt"></i> {% trans "تسجيل خروج" %}
        </a>
      </div>
    </div>
  </body>
</html>
