<!DOCTYPE html>
{% load i18n %}
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "حساب محظور" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #fef2f2; font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 p-3">
    <div class="text-center bg-white p-4 p-md-5 rounded-4 shadow-lg" style="max-width: 500px; border-top: 5px solid #dc3545;">
        <h1 class="display-1 fw-bold text-danger mb-3"><i class="fas fa-ban"></i></h1>
        <h3 class="fw-bold text-dark mb-2">{% trans "عفواً، تم إيقاف حسابك" %}</h3>
        <p class="text-muted small mb-4">{% trans "لقد قمت بمخالفة شروط الاستخدام أو سياسات المنصة، ولذلك تم تقييد وصولك." %}</p>
        <div class="d-grid gap-2">
            <a href="{% url 'create_ticket' %}" class="btn btn-primary py-3 fw-bold shadow-sm rounded-pill"><i class="fas fa-headset me-2"></i> {% trans "تواصل مع الدعم لفك الحظر" %}</a>
            <a href="{% url 'account_logout' %}" class="btn btn-outline-danger py-3 fw-bold rounded-pill mt-2">{% trans "تسجيل خروج" %}</a>
        </div>
    </div>
</body>
</html>
