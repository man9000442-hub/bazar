{% extends "base.html" %}
{% load i18n %}
{% load account socialaccount %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-12 col-md-6 col-lg-4">
        
        <div class="card shadow-lg p-4 border-0" style="background-color: var(--white);">
            <div class="text-center mb-4">
                <h2 class="fw-bold" style="color: var(--text-coffee);">بازارنا</h2>
                <p class="text-muted">سجل دخولك واستمتع بالتسوق</p>
            </div>

            <!-- زر جوجل -->
            <a href="{% provider_login_url 'google' %}" class="btn btn-outline-dark w-100 py-2 mb-3 rounded-3 d-flex align-items-center justify-content-center gap-2">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20">
                تسجيل الدخول باستخدام Google
            </a>

            <div class="d-flex align-items-center mb-3">
                <hr class="flex-grow-1">
                <span class="px-2 text-muted">أو</span>
                <hr class="flex-grow-1">
            </div>

            <!-- فورم الدخول العادي -->
            <form class="login" method="POST" action="{% url 'account_login' %}">
                {% csrf_token %}
                
                {% if form.errors %}
                    <div class="alert alert-danger py-2" style="font-size: 14px;">بيانات الدخول غير صحيحة</div>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label text-muted">البريد الإلكتروني</label>
                    <input type="email" name="login" class="form-control" placeholder="name@example.com" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-muted">كلمة المرور</label>
                    <input type="password" name="password" class="form-control" placeholder="******" required>
                </div>

                <button type="submit" class="btn btn-gold w-100 py-2 rounded-3 fw-bold shadow-sm">دخول</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="{% url 'account_signup' %}" class="text-decoration-none" style="color: var(--text-coffee);">ليس لديك حساب؟ <span class="fw-bold text-gold">سجل الآن</span></a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
