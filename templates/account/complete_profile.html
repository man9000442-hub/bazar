{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-md-6">
        <div class="card shadow p-4 border-0">
            <h3 class="text-center mb-4" style="color: var(--text-coffee);">مرحباً بك! 👋</h3>
            <p class="text-center text-muted">أكمل البيانات لتخصيص تجربتك</p>

            <form method="POST">
                {% csrf_token %}
                
                <!-- 1. اختيار الدور (أزرار الراديو بتصميم أنيق) -->
                <div class="mb-4 text-center">
                    <label class="form-label fw-bold d-block mb-3">أريد التسجيل كـ:</label>
                    
                    <div class="d-flex justify-content-center gap-3">
                        {% for radio in form.role %}
                            <!-- نخفي الراديو الحقيقي ونظهر الليبل فقط -->
                            <input type="radio" name="{{ radio.data.name }}" value="{{ radio.data.value }}" 
                                   class="btn-check" id="{{ radio.id_for_label }}" 
                                   {% if radio.data.selected %}checked{% endif %} required>
                            
                            <label class="btn btn-outline-warning text-dark px-4 py-2 rounded-pill border-2 w-50" 
                                   for="{{ radio.id_for_label }}">
                                {{ radio.choice_label }}
                            </label>
                        {% endfor %}
                    </div>
                </div>

                <!-- 2. الاسم -->
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label text-muted small">الاسم الأول</label>
                        {{ form.first_name }}
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label text-muted small">اسم العائلة</label>
                        {{ form.last_name }}
                    </div>
                </div>

                <!-- 3. الهاتف -->
                <div class="mb-3">
                    <label class="form-label text-muted small">رقم الهاتف الأساسي (واتساب)</label>
                    {{ form.phone_primary }}
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-muted small">رقم هاتف احتياطي (اختياري)</label>
                    {{ form.phone_secondary }}
                </div>

                <button type="submit" class="btn btn-gold w-100 py-2 fw-bold mt-3 shadow-sm">حفظ ومتابعة</button>
            </form>
        </div>
    </div>
</div>

<!-- CSS خاص بهذه الصفحة فقط -->
<style>
    /* عند اختيار زر الراديو، يتغير لونه للذهبي */
    .btn-check:checked + label {
        background-color: var(--primary-gold);
        color: white !important;
        border-color: var(--primary-gold);
    }
    
    /* عند المرور على الزر */
    .btn-outline-warning:hover {
        background-color: #fdf5e6; /* بيج فاتح جداً */
        color: var(--text-coffee);
        border-color: var(--primary-gold);
    }
</style>

{% endblock %}
