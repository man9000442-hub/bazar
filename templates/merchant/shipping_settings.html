{% extends 'base.html' %}

{% block content %}

<!-- Header -->
<div class="bg-white p-3 border-bottom shadow-sm d-flex align-items-center mb-3">
    <a href="{% url 'merchant_dashboard' %}" class="text-dark me-3"><i class="fas fa-arrow-right"></i></a>
    <h5 class="m-0 fw-bold">تسعير الشحن</h5>
</div>

<div class="container pb-5">
    <div class="alert alert-primary bg-primary-subtle border-0 small mb-4">
        <i class="fas fa-info-circle me-1"></i> حدد سعر التوصيل لكل محافظة. اترك الحقل فارغاً لاستخدام السعر الافتراضي (50 ج.م).
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="card border-0 shadow-sm p-3">
            <div class="row g-3">
                
                <!-- التعديل هنا: نستخدم shipping_data -->
                {% for item in shipping_data %}
                <div class="col-6 col-md-4">
                    <label class="form-label small fw-bold text-muted mb-1">{{ item.name }}</label>
                    <div class="input-group input-group-sm">
                        <!-- لاحظ استخدام item.current_rate مباشرة -->
                        <input type="number" 
                               name="rate_{{ item.id }}" 
                               class="form-control bg-light border-0 fw-bold text-center" 
                               placeholder="50"
                               value="{{ item.current_rate }}">
                        <span class="input-group-text bg-white border-0 text-muted small">ج.م</span>
                    </div>
                </div>
                {% endfor %}
                
            </div>
        </div>

        <button type="submit" class="btn btn-primary-app w-100 mt-4 py-3 fw-bold shadow-sm mb-5">حفظ الأسعار</button>
    </form>
</div>
{% endblock %}
