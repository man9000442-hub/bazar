<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_settings.site_name|default:"Elbazaar" }} | توثيق المشروع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f4f7f6; 
            color: #2d3436 !important; /* لون نص داكن واضح */
            line-height: 1.8; 
            padding: 20px;
        }
        .docs-card { 
            background: white; 
            padding: 50px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            max-width: 1000px; 
            margin: 40px auto;
        }
        /* تنسيق كود البرمجة داخل التوثيق */
        pre { 
            background: #2d3436; 
            color: #dfe6e9; 
            padding: 20px; 
            border-radius: 12px; 
            overflow-x: auto; 
            direction: ltr; 
            text-align: left;
        }
        code { font-family: 'Consolas', monospace; color: #e84393; background: #f9f9f9; padding: 2px 6px; border-radius: 4px; }
        pre code { color: inherit; background: transparent; padding: 0; }
        
        /* تنسيق العناوين والجداول لضمان ظهورها باللون الأسود */
        h1, h2, h3, h4, h5, h6 { color: #0984e3; margin-top: 35px; font-weight: 800; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        p, li { color: #2d3436 !important; font-size: 1.1rem; }
        
        table { width: 100%; border-collapse: collapse; margin: 25px 0; background: #fff; }
        table th, table td { border: 1px solid #dfe6e9; padding: 15px; text-align: right; color: #2d3436 !important; }
        table th { background-color: #f1f2f6; font-weight: bold; }
        
        .back-btn { margin-bottom: 20px; display: inline-block; text-decoration: none; color: #636e72; font-weight: bold; }
        .back-btn:hover { color: #0984e3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="docs-card">
            <a href="javascript:history.back()" class="back-btn">← العودة للخلف</a>
            <hr>
            <div class="markdown-body">
                {{ doc_content }}
            </div>
        </div>
    </div>
</body>
</html>
