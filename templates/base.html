<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Elbazaar{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* 1. نظام الألوان الجديد */
        :root {
            --primary-blue: #0d6efd;  /* أزرق أساسي */
            --accent-yellow: #ffc107; /* أصفر مميز */
            --bg-light: #f8f9fa;      /* خلفية فاتحة */
            --text-dark: #212529;
            --white: #ffffff;
        }

        body { 
            /* هامش سفلي كبير لمنع اختفاء المحتوى وراء النافبار والأزرار العائمة */
            padding-bottom: 120px !important; 
            background-color: var(--bg-light); 
            font-family: 'Tajawal', sans-serif;
            color: var(--text-dark);
            -webkit-tap-highlight-color: transparent;
        }

        /* 2. شريط التنقل السفلي (Bottom Nav) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            /* ظل ناعم للأعلى */
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            z-index: 1000;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-radius: 20px 20px 0 0;
        }

        .nav-item { 
            text-align: center; 
            color: #adb5bd; /* لون رمادي باهت */
            text-decoration: none; 
            font-size: 10px; 
            font-weight: 500;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 20%;
        }

        .nav-item i { 
            font-size: 22px; 
            margin-bottom: 4px; 
            transition: 0.3s;
        }

        /* حالة التفعيل (Active) */
        .nav-item.active { 
            color: var(--primary-blue); 
        }
        
        .nav-item.active i {
            transform: translateY(-3px);
            color: var(--primary-blue);
        }

        /* 3. تحسينات عامة */
        a { text-decoration: none; }
        
        /* زر التطبيق الأساسي */
        .btn-primary-app {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 50px;
            transition: 0.2s;
        }
        .btn-primary-app:hover {
            background-color: #0b5ed7;
            color: white;
        }
        .btn-primary-app:active {
            transform: scale(0.98);
        }

        /* إخفاء السكرول بار للموبايل */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- رسائل التنبيه (Toasts) -->
    <div class="fixed-top p-3" style="z-index: 2000; pointer-events: none;">
        {% if messages %}
            {% for message in messages %}
                <div class="toast show align-items-center text-white bg-{{ message.tags }} border-0 mb-2 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body fw-bold">
                            {{ message }}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- المحتوى المتغير -->
    <div class="container-fluid px-0">
        {% block content %}{% endblock %}
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- الرئيسية -->
        <a href="{% url 'home' %}" class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
            <i class="fas fa-home"></i> الرئيسية
        </a>
        
        <!-- الأقسام -->
        <a href="{% url 'categories_page' %}" class="nav-item {% if request.resolver_match.url_name == 'categories_page' %}active{% endif %}">
            <i class="fas fa-th-large"></i> الأقسام
        </a>
        
        <!-- السلة (الوسطى) -->
        <a href="{% url 'cart_view' %}" class="nav-item position-relative {% if request.resolver_match.url_name == 'cart_view' %}active{% endif %}">
            <div class="bg-primary-app rounded-circle p-3 position-absolute top-0 start-50 translate-middle shadow-sm border border-4 border-white" style="margin-top: -20px;">
                <i class="fas fa-shopping-cart text-white fs-5 m-0"></i>
            </div>
            <span style="margin-top: 25px;">السلة</span>
        </a>
        
        <!-- المفضلة -->
        <a href="{% url 'wishlist' %}" class="nav-item {% if request.resolver_match.url_name == 'wishlist' %}active{% endif %}">
            <i class="fas fa-heart"></i> المفضلة
        </a>
        
        <!-- حسابي -->
        <a href="{% url 'profile' %}" class="nav-item {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
            <i class="fas fa-user"></i> حسابي
        </a>
    </nav>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- لإخفاء الرسائل تلقائياً -->
    <script>
        setTimeout(function() {
            var toasts = document.querySelectorAll('.toast');
            toasts.forEach(function(toast) {
                var bsToast = new bootstrap.Toast(toast);
                bsToast.hide();
            });
        }, 3000);
    </script>

    <a href="{% url 'my_tickets' %}" class="btn btn-dark rounded-circle shadow-lg d-flex align-items-center justify-content-center position-fixed" 
    style="width: 50px; height: 50px; bottom: 80px; right: 20px; z-index: 1000;">
        <i class="fas fa-headset fs-4"></i>
    </a>
</body>
</html>
