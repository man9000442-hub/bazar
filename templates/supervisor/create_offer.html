{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow p-4 border-0">
        <h5 class="fw-bold mb-3 text-primary">إنشاء عرض منصة (Platform Offer) 🏷️</h5>
        <p class="text-muted small">هذا العرض مدعوم من المنصة. سيتم تعويض التاجر عن فرق السعر تلقائياً.</p>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">اختر المنتج</label>
                <select name="product_id" class="form-select select2" required>
                    <option value="">بحث عن منتج...</option>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} - {{ p.base_price }} ج.م ({{ p.merchant.user.first_name }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label">نسبة الخصم (%)</label>
                    <input type="number" name="percentage" class="form-control" min="1" max="100" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label">المدة (أيام)</label>
                    <input type="number" name="days" class="form-control" value="3" required>
                </div>
            </div>
            <!-- داخل الفورم -->
            <hr class="my-3">
            <h6 class="fw-bold text-success mb-3"><i class="fas fa-truck me-2"></i> شحن مجاني (مدعوم)</h6>

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" name="free_shipping" id="freeShip">
                <label class="form-check-label" for="freeShip">تفعيل الشحن المجاني</label>
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text">بشرط شراء</span>
                <input type="number" name="threshold" class="form-control" value="1" min="1">
                <span class="input-group-text">قطع</span>
            </div>
            <div class="form-text text-muted small">
                * في حالة تفعيل هذا الخيار، سيتم تعويض التاجر عن قيمة الشحن بالكامل.
            </div>

            <button type="submit" class="btn btn-gold w-100 fw-bold">إطلاق العرض 🚀</button>
        </form>
    </div>
</div>
{% endblock %}
