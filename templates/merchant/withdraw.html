{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h5 class="fw-bold text-coffee mb-3">طلب سحب أرباح 💸</h5>
    <div class="card p-4 border-0 shadow-sm">
        <div class="alert alert-info small">
            رصيدك المتاح: <strong>{{ wallet.balance }} ج.م</strong>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">المبلغ المراد سحبه</label>
                <input type="number" name="amount" class="form-control" max="{{ wallet.balance }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">رقم المحفظة (فودافون كاش/إلخ)</label>
                <input type="tel" name="phone" class="form-control" value="{{ request.user.phone_primary }}" required>
            </div>
            <button type="submit" class="btn btn-primary-app w-100 fw-bold">تأكيد الطلب</button>
        </form>
    </div>
</div>
{% endblock %}
