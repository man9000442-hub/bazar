{% extends 'base.html' %}

{% block content %}
<div class="container mb-5">
    <div class="d-flex align-items-center mb-4 pt-2">
        <a href="{% url 'merchant_dashboard' %}" class="text-decoration-none text-muted me-3">
            <i class="fas fa-arrow-right fs-5"></i>
        </a>
        <h5 class="m-0 fw-bold" style="color: var(--text-coffee);">إضافة منتج جديد 📦</h5>
    </div>

    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm border-0">
        {% csrf_token %}

        <!-- 1. تفاصيل المنتج -->
        <h6 class="fw-bold text-primary mb-3">1. تفاصيل المنتج</h6>
        
        <div class="mb-3">
            <label class="form-label small text-muted">اسم المنتج</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="row">
            <div class="col-4 mb-3">
                <label class="form-label small text-muted">السعر (ج.م)</label>
                <input type="number" name="price" class="form-control" step="0.5" required>
            </div>
            {% comment %} <div class="col-4 mb-3">
                <label class="form-label small text-muted">شحن إضافي (للأحجام الكبيرة)</label>
                <input type="number" name="shipping_fee" class="form-control" value="0" step="1">
                <div class="form-text small" style="font-size: 9px;">يضاف فوق سعر شحن المحافظة.</div>
            </div> {% endcomment %}
            <div class="col-4 mb-3">
                <label class="form-label small text-muted">القسم</label>
                <select name="category" class="form-select" required>
                    <option value="">اختر...</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small text-muted">وصف المنتج</label>
            <textarea name="description" class="form-control" rows="3" required></textarea>
        </div>

        <div class="mb-4">
            <label class="form-label small text-muted">الصورة الرئيسية</label>
            <input type="file" name="main_image" class="form-control" accept="image/*" required>
        </div>

        <!-- 2. المخزون (النظام الجديد المتداخل) -->
        <h6 class="fw-bold text-primary mb-3">2. المخزون (الألوان والمقاسات)</h6>
        
        <div id="variants-wrapper">
            <!-- هنا تظهر الكروت -->
        </div>

        <button type="button" class="btn btn-outline-primary w-100 mb-4 dashed-border" onclick="addColorGroup()">
            <i class="fas fa-plus-circle me-1"></i> إضافة لون جديد
        </button>

        <!-- 3. صور إضافية -->
        <h6 class="fw-bold text-primary mb-3">3. صور المعرض (اختياري)</h6>
        <div class="mb-4">
            <input type="file" name="gallery_images" class="form-control" multiple accept="image/*">
        </div>

        <button type="submit" class="btn btn-primary-app w-100 fw-bold py-3 shadow-sm">حفظ المنتج</button>
    </form>
</div>

<style>
    .dashed-border { border: 2px dashed #cfe2ff; background: #f8f9fa; color: #0d6efd; }
    .dashed-border:hover { background: #e7f1ff; }
</style>

<script>
let groupCounter = 0;

function addColorGroup() {
    groupCounter++;
    const wrapper = document.getElementById('variants-wrapper');
    
    const card = document.createElement('div');
    card.className = 'card border-0 shadow-sm mb-3 bg-light';
    
    card.innerHTML = `
        <div class="card-header bg-white border-bottom-0 d-flex justify-content-between align-items-center pt-3">
            <div class="d-flex align-items-center flex-grow-1 me-3">
                <span class="badge bg-primary rounded-circle me-2">${groupCounter}</span>
                <input type="text" name="color_group_${groupCounter}" class="form-control form-control-sm border fw-bold" placeholder="اكتب اسم اللون (مثلاً: أحمر)" required>
            </div>
            <button type="button" class="btn btn-sm text-danger" onclick="this.closest('.card').remove()"><i class="fas fa-trash-alt"></i></button>
        </div>
        
        <div class="card-body pt-0">
            <hr class="text-muted opacity-25 mt-0 mb-3">
            <div id="sizes-container-${groupCounter}"></div>
            
            <button type="button" class="btn btn-sm btn-link text-decoration-none p-0 mt-2" onclick="addSizeRow(${groupCounter})">
                <i class="fas fa-plus"></i> أضف مقاساً لهذا اللون
            </button>
        </div>
    `;
    
    wrapper.appendChild(card);
    addSizeRow(groupCounter);
}

function addSizeRow(groupId) {
    const container = document.getElementById(`sizes-container-${groupId}`);
    const row = document.createElement('div');
    row.className = 'row g-2 mb-2 align-items-center';
    
    row.innerHTML = `
        <div class="col-5">
            <input type="text" name="sizes_group_${groupId}[]" class="form-control form-control-sm" placeholder="المقاس (XL)" required>
        </div>
        <div class="col-5">
            <input type="number" name="qtys_group_${groupId}[]" class="form-control form-control-sm" placeholder="الكمية" required>
        </div>
        <div class="col-2 text-center">
            <i class="fas fa-times text-muted cursor-pointer" onclick="this.closest('.row').remove()"></i>
        </div>
    `;
    container.appendChild(row);
}

// تشغيل أول لون تلقائياً
document.addEventListener('DOMContentLoaded', function() {
    addColorGroup();
});
</script>
{% endblock %}
