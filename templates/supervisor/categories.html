{% extends 'supervisor/base_supervisor.html' %}
{% block page_title %}إدارة الأقسام{% endblock %}

{% block content %}
<div class="row">
    <!-- نموذج الإضافة -->
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-4 rounded-4">
            <h6 class="fw-bold mb-3">إضافة قسم جديد</h6>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small">اسم القسم</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">صورة القسم</label>
                    <input type="file" name="image" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill">حفظ</button>
            </form>
        </div>
    </div>

    <!-- القائمة -->
    <div class="col-md-8">
        <div class="card border-0 shadow-sm rounded-4">
            <table class="table align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">الصورة</th>
                        <th>الاسم</th>
                        <th class="text-end pe-4">حذف</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cat in categories %}
                    <tr>
                        <td class="ps-4">
                            {% if cat.image %}
                                <img src="{{ cat.image.url }}" class="rounded" width="40">
                            {% else %}
                                <div class="bg-light rounded d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;"><i class="fas fa-image text-muted"></i></div>
                            {% endif %}
                        </td>
                        <td class="fw-bold">{{ cat.name }}</td>
                        <td class="text-end pe-4">
                            <a href="{% url 'super_delete_category' cat.pk %}" class="btn btn-sm btn-light text-danger border" onclick="return confirm('حذف؟')"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
