{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow border-0">
        <div class="card-header bg-white border-0 pt-4 text-center">
            <h4 class="fw-bold" style="color: var(--text-coffee);">تفعيل حساب التاجر 🏪</h4>
            <p class="text-muted small">يرجى رفع المستندات التالية للموافقة على متجرك</p>
        </div>
        
        <div class="card-body p-4">
            <form method="POST" enctype="multipart/form-data"> <!-- enctype مهم جداً لرفع الصور -->
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold">الرقم القومي</label>
                    {{ form.national_id }}
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">صورة البطاقة (أمام)</label>
                        {{ form.id_card_front }}
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">صورة البطاقة (خلف)</label>
                        {{ form.id_card_back }}
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">صورة المحل / اللوجو</label>
                    {{ form.shop_image }}
                    <div class="form-text">ستظهر هذه الصورة للعملاء في صفحة متجرك</div>
                </div>

                <button type="submit" class="btn btn-gold w-100 py-2 fw-bold shadow-sm">إرسال للمراجعة</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
