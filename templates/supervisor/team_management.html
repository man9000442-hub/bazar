{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">
    <h5 class="fw-bold mb-4">إدارة فريق العمل 👥</h5>
    
    <!-- فورم الإضافة -->
    <div class="card p-4 shadow-sm border-0 mb-4">
        <h6 class="text-primary mb-3">إضافة مشرف جديد</h6>
        <form method="POST">
            {% csrf_token %}
            <div class="row g-2">
                <div class="col-6">
                    <input type="text" name="username" class="form-control" placeholder="اسم المستخدم" required>
                </div>
                <div class="col-6">
                    <input type="text" name="phone" class="form-control" placeholder="رقم الهاتف" required>
                </div>
                <div class="col-6">
                    <input type="password" name="password" class="form-control" placeholder="كلمة المرور" required>
                </div>
                <div class="col-6">
                    <select name="role" class="form-select" required>
                        <option value="">اختر الدرجة...</option>
                        <option value="ADMIN_LVL3">خدمة عملاء (Lvl 3)</option>
                        {% if request.user.role == 'OWNER' or request.user.is_superuser %}
                        <option value="ADMIN_LVL2">مدير (Lvl 2)</option>
                        {% endif %}
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-dark w-100 mt-3">تعيين</button>
        </form>
    </div>

    <!-- القائمة -->
    <h6 class="fw-bold mb-3">الأعضاء الحاليين</h6>
    <div class="list-group">
        {% for member in team %}
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <span class="fw-bold">{{ member.username }}</span>
                <span class="badge bg-light text-dark border ms-2">{{ member.get_role_display }}</span>
            </div>
            <small class="text-muted">{{ member.phone_primary }}</small>
        </div>
        {% empty %}
        <p class="text-muted small">لا يوجد مشرفين آخرين.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
