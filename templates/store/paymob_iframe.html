{% extends 'base.html' %}
{% load i18n %} {% block content %}

<style>
    .dark-header {
        background-color: var(--dark-bg, #091024);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .dark-card {
        background-color: var(--dark-surface, #121d3a);
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .gold-text {
        color: var(--gold-accent, #ffc107) !important;
    }
    .text-muted-dark {
        color: #8fa0c1 !important;
    }
    .btn-dark-danger {
        color: #ff6b6b;
        border: 1px solid rgba(220, 53, 69, 0.5);
        background: rgba(220, 53, 69, 0.05);
        transition: 0.3s;
    }
    .btn-dark-danger:hover {
        background: rgba(220, 53, 69, 0.15);
        color: #ff4747;
        transform: scale(0.95);
    }
    
    /* إخفاء البوتوم ناف لتوفير مساحة للإطار وجعل الخلفية داكنة تماماً */
    .bottom-nav { display: none !important; }
    body { 
        padding-bottom: 0 !important; 
        background-color: var(--dark-bg, #091024) !important; 
    }
    html, body {
        height: 100%;
        overflow: hidden; /* لمنع السكرول المزدوج */
    }
</style>

<div class="container py-3 d-flex flex-column" style="height: 100vh;"> 
    
    <div class="d-flex justify-content-between align-items-center mb-3 px-1 pt-2">
        <h5 class="fw-bold m-0 text-white" style="letter-spacing: 0.5px;">
            {% trans "الدفع الآمن" %} <span class="gold-text"><i class="fas fa-shield-alt ms-1"></i></span>
        </h5>
        <a href="{% url 'my_orders' %}" class="btn btn-sm btn-dark-danger rounded-pill px-4 fw-bold">{% trans "إلغاء" %}</a>
    </div>

    <div class="card dark-card shadow-lg border-0 flex-grow-1 overflow-hidden rounded-4 mb-3 position-relative">
        
        <div class="position-absolute top-50 start-50 translate-middle text-center z-0">
            <i class="fas fa-circle-notch fa-spin fa-3x gold-text mb-3 opacity-75"></i>
            <p class="text-muted-dark small fw-bold">{% trans "جاري تحميل بوابة الدفع..." %}</p>
        </div>
        
        <iframe src="{{ iframe_url }}" width="100%" height="100%" frameborder="0" class="position-relative z-1" style="background-color: transparent;"></iframe>
    </div>

</div>

{% endblock %}
