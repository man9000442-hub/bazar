{% extends 'base.html' %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center py-5 mt-4">
    <div class="mb-4">
        <div class="rounded-circle d-flex align-items-center justify-content-center shadow-sm mx-auto" 
             style="width: 100px; height: 100px; background-color: #e8f5e9;">
            <i class="fas fa-check fa-3x text-success"></i>
        </div>
    </div>
    
    <h3 class="fw-bold text-coffee mb-2">تم الطلب بنجاح! 🎉</h3>
    <p class="text-muted mb-4" style="max-width: 300px;">
        شكراً لتسوقك معنا. رقم طلبك محفوظ، وسيتم التواصل معك قريباً لتأكيد الشحن.
    </p>
    
    <div class="d-grid gap-2 col-8 mx-auto">
        <a href="{% url 'home' %}" class="btn btn-gold fw-bold rounded-pill">عودة للرئيسية</a>
        <a href="{% url 'customer_order_detail' %}" class="btn btn-outline-secondary fw-bold rounded-pill">تتبع الطلب</a>
    </div>
</div>
{% endblock %}
