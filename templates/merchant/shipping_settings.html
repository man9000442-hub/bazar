{% extends 'base.html' %}

{% block content %}
<div class="container mb-5">
    <h5 class="fw-bold mb-4" style="color: var(--text-coffee);">إعدادات الشحن 🚚</h5>
    <p class="text-muted small">حدد سعر التوصيل الخاص بك لكل محافظة.</p>

    <form method="POST" class="card p-3 shadow-sm border-0">
        {% csrf_token %}
        
        <div class="row g-3">
            {% for gov in governorates %}
            <div class="col-6 col-md-4">
                <label class="form-label small fw-bold">{{ gov.name }}</label>
                <div class="input-group input-group-sm">
                    <!-- كود بايثون بسيط لجلب السعر الحالي من القاموس -->
                    <!-- ملاحظة: في القوالب لا يمكن الوصول للقاموس بالـ key المتغير بسهولة، لذا سنستخدم فلتر مخصص أو منطق بسيط -->
                    <!-- للتبسيط سنضع القيمة فارغة أو نستخدم JS، لكن الحل الأسهل هنا هو الاعتماد على التكرار -->
                     
                     <!-- حل سريع لعرض القيمة: -->
                     <!-- سنقوم بتعديل الـ View قليلاً لإرسال البيانات مدمجة، لكن دعنا نستخدم خدعة بسيطة هنا -->
                    <input type="number" name="rate_{{ gov.id }}" class="form-control" 
                           placeholder="50" step="5"
                           value="50"> <!-- يمكنك تحسين عرض القيمة المحفوظة لاحقاً -->
                    <span class="input-group-text">ج.م</span>
                </div>
            </div>
            {% endfor %}
        </div>

        <button type="submit" class="btn btn-gold w-100 mt-4 fw-bold shadow-sm">حفظ الأسعار</button>
    </form>
</div>
{% endblock %}
