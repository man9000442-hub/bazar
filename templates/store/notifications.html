{% extends 'base.html' %}

{% block content %}

<!-- Header -->
<div class="bg-white p-3 border-bottom shadow-sm d-flex align-items-center mb-3 sticky-top">
    <a href="javascript:history.back()" class="text-dark me-3"><i class="fas fa-arrow-right"></i></a>
    <h5 class="m-0 fw-bold">الإشعارات 🔔</h5>
</div>

<div class="container pb-5">
    {% for notif in notifications %}
    <a href="{{ notif.link|default:'#' }}" class="text-decoration-none text-dark">
        <div class="card border-0 shadow-sm mb-2 {% if not notif.is_read %}bg-primary-subtle{% else %}bg-white{% endif %}">
            <div class="card-body p-3 d-flex align-items-start">
                
                <!-- أيقونة حسب نوع الإشعار (اختياري) -->
                <div class="bg-white rounded-circle p-2 me-3 text-primary shadow-sm" style="width: 40px; height: 40px; display: flex; justify-content: center; align-items: center;">
                    <i class="fas fa-bell"></i>
                </div>
                
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between">
                        <h6 class="fw-bold mb-1 small">{{ notif.title }}</h6>
                        <small class="text-muted" style="font-size: 10px;">{{ notif.created_at|timesince }}</small>
                    </div>
                    <p class="text-muted small mb-0" style="line-height: 1.4;">{{ notif.message }}</p>
                </div>
                
                <!-- نقطة زرقاء للجديد -->
                {% if not notif.is_read %}
                    <span class="position-absolute top-0 start-0 translate-middle p-1 bg-danger border border-light rounded-circle ms-3 mt-3"></span>
                {% endif %}
            </div>
        </div>
    </a>
    {% empty %}
    <div class="text-center py-5 mt-5">
        <div class="bg-light rounded-circle d-inline-flex p-4 mb-3">
            <i class="far fa-bell-slash fa-3x text-muted opacity-50"></i>
        </div>
        <h6 class="fw-bold text-muted">لا توجد إشعارات</h6>
        <p class="text-muted small">سنخبرك بأي تحديثات جديدة هنا.</p>
    </div>
    {% endfor %}
</div>

{% endblock %}
