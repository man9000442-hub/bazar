{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-bottom py-3">
            <h4 class="fw-bold text-primary mb-0">الشروط والأحكام</h4>
        </div>
        <div class="card-body p-4" style="line-height: 1.8; text-align: justify;">
            
            {% for term in terms %}
                <h5 class="fw-bold mt-4 text-dark">{{ forloop.counter }}. {{ term.title }}</h5>
                <p class="text-muted">{{ term.content|linebreaksbr }}</p>
            {% empty %}
                <p class="text-center text-muted py-5">لا توجد شروط حالياً.</p>
            {% endfor %}

            <hr class="my-5">
            <div class="text-center">
                <a href="javascript:history.back()" class="btn btn-primary-app px-5 rounded-pill fw-bold shadow-sm">عودة</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
