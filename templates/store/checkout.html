{% extends 'base.html' %}

{% block content %}

<!-- Header -->
<div class="bg-white p-3 border-bottom shadow-sm d-flex align-items-center mb-3">
    <a href="javascript:history.back()" class="text-dark me-3"><i class="fas fa-arrow-right"></i></a>
    <h5 class="m-0 fw-bold">الشحن والدفع</h5>
</div>

<div class="container pb-5 mb-5">
    <form method="POST">
        {% csrf_token %}
        
        <!-- 1. عنوان التوصيل -->
        <div class="card border-0 shadow-sm mb-3 p-3">
            <h6 class="fw-bold mb-3 d-flex align-items-center">
                <div class="bg-light rounded-circle p-2 me-2"><i class="fas fa-map-marker-alt text-primary"></i></div>
                عنوان التوصيل
            </h6>
            
            <div class="mb-3">
                <label class="form-label text-muted small">المحافظة</label>
                <select name="city" id="city-select" class="form-select bg-light border-0" onchange="updateShipping()" required>
                    <option value="">اختر المحافظة...</option>
                    {% for gov in governorates %}
                    <option value="{{ gov.id }}">{{ gov.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted small">العنوان التفصيلي</label>
                <textarea name="address" class="form-control bg-light border-0" rows="2" placeholder="اسم الشارع، رقم العمارة..." required></textarea>
            </div>

            <div class="mb-0">
                <label class="form-label text-muted small">رقم الهاتف</label>
                <input type="tel" name="phone" class="form-control bg-light border-0" value="{{ request.user.phone_primary }}" required>
            </div>
        </div>

        <!-- 2. ملخص الدفع -->
        <div class="card border-0 shadow-sm mb-3 p-3 bg-white">
            <h6 class="fw-bold mb-3">ملخص الدفع</h6>
            
            <div class="d-flex justify-content-between mb-2 small">
                <span class="text-muted">قيمة المنتجات</span>
                <span class="fw-bold">{{ order.total_products_price }} ج.م</span>
            </div>
            
            <div class="d-flex justify-content-between mb-2 small">
                <span class="text-muted">رسوم الشحن</span>
                <span id="shipping-cost" class="fw-bold text-dark">-- ج.م</span>
            </div>
            
            <hr class="my-2">
            
            <div class="d-flex justify-content-between align-items-center">
                <span class="fw-bold">الإجمالي الكلي</span>
                <span id="final-total" class="fw-bold text-primary fs-5">-- ج.م</span>
            </div>
        </div>

        <!-- زر التأكيد العائم -->
        <div class="fixed-bottom bg-white p-3 border-top shadow-lg" style="bottom: 70px;">
            <button type="submit" class="btn btn-primary-app w-100 py-3 fw-bold shadow-sm" id="confirm-btn" disabled>
                تأكيد الطلب (دفع عند الاستلام)
            </button>
        </div>
    </form>
</div>

<!-- JavaScript لحساب الشحن تلقائياً -->
<script>
function updateShipping() {
    const govId = document.getElementById('city-select').value;
    const shippingEl = document.getElementById('shipping-cost');
    const totalEl = document.getElementById('final-total');
    const loadingEl = document.getElementById('shipping-loading');
    const confirmBtn = document.getElementById('confirm-btn');
    const msgEl = document.getElementById('select-city-msg');

    // إذا لم يتم اختيار محافظة
    if (!govId) {
        shippingEl.innerText = "-- ج.م";
        totalEl.innerText = "-- ج.م";
        confirmBtn.disabled = true;
        msgEl.style.display = 'block';
        return;
    }

    // إظهار اللودينج
    loadingEl.style.display = 'block';
    shippingEl.innerText = "...";
    totalEl.innerText = "...";
    confirmBtn.disabled = true; // تعطيل الزر حتى ينتهي الحساب

    // استدعاء API الباك إند
    fetch(`/api/calc-shipping/?gov_id=${govId}`)
        .then(response => {
            if (!response.ok) { throw new Error('Network response was not ok'); }
            return response.json();
        })
        .then(data => {
            // تحديث الأرقام في الصفحة
            shippingEl.innerText = data.shipping.toFixed(2) + " ج.م";
            totalEl.innerText = data.total.toFixed(2) + " ج.م";
            
            // تفعيل زر التأكيد وإخفاء اللودينج
            loadingEl.style.display = 'none';
            confirmBtn.disabled = false;
            msgEl.style.display = 'none';
        })
        .catch(error => {
            console.error('Error fetching shipping cost:', error);
            shippingEl.innerText = "خطأ";
            totalEl.innerText = "خطأ";
            loadingEl.style.display = 'none';
            alert("حدث خطأ أثناء حساب الشحن. يرجى المحاولة مرة أخرى.");
        });
}
</script>



{% endblock %}
